name: VPS - Scan and Restart All Projects

# Scans every Node.js project under /home and /root/bots for the
# global.o='1-310' dropper, cleans any infected files with sed,
# reinstalls affected projects with --ignore-scripts (blocks re-injection),
# then starts all PM2 processes.

on:
  workflow_dispatch:

jobs:
  scan-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Decode deploy key
        run: |
          KEY=$(echo "${{ secrets.SERVER_SSH_KEY }}" | base64 -d)
          if ! printf '%s' "$KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "SERVER_SSH_KEY did not decode to a valid private key."; exit 1
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          {
            echo "SSH_PRIVATE_KEY<<__DEPLOY_KEY_EOF__"
            echo "$KEY"
            echo "__DEPLOY_KEY_EOF__"
          } >> "$GITHUB_ENV"

      - name: Scan, clean and restart all projects
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -e

            echo "======================================================"
            echo "SCAN: All projects under /home and /root/bots"
            echo "======================================================"
            INFECTED=$(grep -rl \
              --include="*.js" --include="*.ts" --include="*.mjs" \
              --exclude-dir=node_modules --exclude-dir=.git \
              "eval(atob\|global\.o='" \
              /home /root/bots 2>/dev/null || true)

            if [ -z "$INFECTED" ]; then
              echo "All projects are clean. No malware found."
            else
              echo "INFECTED FILES:"
              echo "$INFECTED"
              echo ""

              echo "======================================================"
              echo "CLEAN: Removing malware payload from each file"
              echo "======================================================"
              echo "$INFECTED" | while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "Cleaning: $f"
                # Malware is appended on the last clean line after 20+ spaces.
                # First pattern covers the eval("global.o= form (tailwind/postcss).
                # Second covers the bare global.o= form (server.js).
                sed -i 's/[[:space:]]\{20,\}eval("global\.o=.*$//' "$f"
                sed -i 's/[[:space:]]\{20,\}global\.o=.*//'         "$f"
              done

              echo "======================================================"
              echo "REINSTALL: npm --ignore-scripts for infected projects"
              echo "======================================================"
              # Extract unique package.json directories from the infected paths
              echo "$INFECTED" | while IFS= read -r f; do
                [ -z "$f" ] && continue
                # Walk up from the infected file to find the nearest package.json
                dir=$(dirname "$f")
                while [ "$dir" != "/" ]; do
                  if [ -f "$dir/package.json" ] && [ -d "$dir/node_modules" ]; then
                    echo "Reinstalling: $dir"
                    (cd "$dir" && rm -rf node_modules && npm install --ignore-scripts 2>&1 | tail -3) || true
                    break
                  fi
                  dir=$(dirname "$dir")
                done
              done
            fi

            echo "======================================================"
            echo "VERIFY: Final scan across all projects"
            echo "======================================================"
            REMAINING=$(grep -rl \
              --include="*.js" --include="*.ts" --include="*.mjs" \
              --exclude-dir=node_modules --exclude-dir=.git \
              "eval(atob\|global\.o='" \
              /home /root/bots 2>/dev/null || true)

            if [ -n "$REMAINING" ]; then
              echo "WARNING — still infected after cleaning:"
              echo "$REMAINING"
              exit 1
            fi
            echo "All projects verified clean."

            echo "======================================================"
            echo "START: Restarting all PM2 processes"
            echo "======================================================"
            pm2 start all
            pm2 save
            pm2 list
