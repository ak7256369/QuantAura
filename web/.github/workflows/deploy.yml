name: Deploy to quantaura.tech

on:
  push:
    branches: [main]
    # The channel pipeline commits its scoreboard to main every day. None of
    # that is served by the VPS, so a deploy for it would rebuild Next.js and
    # bounce the web tier daily for nothing.
    #
    # .github/ is ignored for the same reason and was the gap: editing a
    # channel workflow still triggered a full deploy, because only channel/**
    # was excluded. That rebuilt Next.js and restarted ml-api — a ~40s
    # prediction outage — to ship a cron change the server never reads.
    # A workflow edit takes effect on its own next run; it needs no deploy.
    paths-ignore:
      - 'channel/**'
      - '.github/**'
      - '**/*.md'
  # The trainer needs this. GitHub does not trigger workflows from pushes made
  # with GITHUB_TOKEN (a recursion guard), so train.yml's weight commits land on
  # main without ever firing the push trigger above — freshly trained models
  # would pile up in git and never reach the VPS. train.yml dispatches this
  # explicitly after a successful commit. Also the manual re-run path.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # The key is passed to the action IN MEMORY rather than through a file.
      # appleboy/ssh-action is a container action, and a key file has to satisfy
      # two conflicting constraints at once: it must sit inside the mounted
      # workspace (the container cannot see the runner's ~/.ssh, and Go does not
      # expand '~'), yet chmod 600 makes it unreadable to the container, which
      # runs as a different user than the runner. Those two failures are exactly
      # what the deploy hit in sequence:
      #   getKeyFile error: open ~/.ssh/deploy_key: no such file or directory
      #   getKeyFile error: open /github/workspace/deploy_key: permission denied
      # Loosening the key to 0644 would resolve the second, but leaves a
      # world-readable private key on disk. The `key` input avoids both.
      - name: Decode deploy key
        run: |
          KEY=$(echo "${{ secrets.SERVER_SSH_KEY }}" | base64 -d)
          if ! printf '%s' "$KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "SERVER_SSH_KEY did not decode to a private key."
            echo "It must hold the base64 of a PEM private key, e.g.:"
            echo "  base64 -w0 ~/.ssh/id_ed25519"
            exit 1
          fi
          # Register every line as a mask: GitHub masks the stored secret, but
          # not the decoded form, which would otherwise be one stray echo away
          # from appearing in a public build log.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          {
            echo "SSH_PRIVATE_KEY<<__DEPLOY_KEY_EOF__"
            echo "$KEY"
            echo "__DEPLOY_KEY_EOF__"
          } >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          # npm install + next build on a small VPS regularly exceeds the
          # 10m default, which surfaces as a confusing mid-deploy timeout.
          command_timeout: 30m
          script: |
            set -e
            cd /home/quantaura.tech/public_html

            # This box is a deploy target, not a workstation: origin/main is the
            # source of truth for every tracked file, code and model weights
            # alike. Any local edit is drift — a hand-applied hotfix, a config
            # tweaked in place — and it does not merge, it blocks the deploy:
            #   error: Your local changes to the following files would be
            #   overwritten by merge: ecosystem.config.js
            # Record the drift so it is recoverable, then take the remote state
            # verbatim. This only touches TRACKED files; .env, node_modules/,
            # data/ and other untracked or ignored paths are left alone.
            git fetch origin main
            if ! git diff --quiet HEAD; then
              echo "Local drift on the server (saved to /tmp, then discarded):"
              git diff --name-only HEAD
              git diff HEAD > "/tmp/server_drift_$(date +%F_%H%M).patch" || true
            fi

            # Code AND models move together. Order matters: serve.py refuses to
            # serve weights that don't match the architecture, so shipping code
            # without its models takes the API down rather than letting it
            # emit noise.
            BEFORE=$(git rev-parse HEAD)
            git reset --hard origin/main
            AFTER=$(git rev-parse HEAD)

            # The autopilot ships improved weights several times a day, and
            # those commits touch nothing but quantaura-ml/. Rebuilding Next.js
            # and bouncing the web tier for them costs minutes of needless
            # downtime, so scope the work to what actually changed.
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^quantaura-ml/'; then
              WEB_CHANGED=0
              echo "Models/ML-only change - restarting ml-api only:"
            else
              WEB_CHANGED=1
              echo "Web or mixed change - full deploy:"
            fi
            echo "$CHANGED" | sed 's/^/  /' | head -20

            if [ "$WEB_CHANGED" = "1" ]; then
              cd quantaura
              npm install --production=false
              npm run build
              cd ..

              cd quantaura-api
              npm install --production
              cd ..
            fi

            # The account page's Telegram card hides itself when the API reports
            # no bot username — which reads to a user as "the feature was never
            # built" rather than "one env var is blank". The value is not a
            # secret and MUST equal the bot's own TELEGRAM_BOT_USERNAME, so take
            # it from the bot's .env rather than keeping two copies in sync by
            # hand. Non-fatal: the product deploys fine with no bot installed.
            API_ENV_CHANGED=0
            API_ENV=quantaura-api/.env
            BOT_ENV=/home/quantaura.tech/bots/quantaura-telegram-bot/.env
            if ! grep -qE '^TELEGRAM_BOT_USERNAME=.+' "$API_ENV" 2>/dev/null; then
              BOT_NAME=$(grep -E '^TELEGRAM_BOT_USERNAME=' "$BOT_ENV" 2>/dev/null \
                | cut -d= -f2- | tr -d '[:space:]' | sed 's/^@//')
              if [ -n "$BOT_NAME" ]; then
                if grep -qE '^TELEGRAM_BOT_USERNAME=' "$API_ENV"; then
                  sed -i "s|^TELEGRAM_BOT_USERNAME=.*|TELEGRAM_BOT_USERNAME=$BOT_NAME|" "$API_ENV"
                else
                  printf '\nTELEGRAM_BOT_USERNAME=%s\n' "$BOT_NAME" >> "$API_ENV"
                fi
                echo "Set TELEGRAM_BOT_USERNAME=$BOT_NAME in quantaura-api/.env (from the bot's .env)"
                API_ENV_CHANGED=1
              else
                echo "Note: TELEGRAM_BOT_USERNAME is blank in quantaura-api/.env and the bot's"
                echo ".env was not readable — the account page's Telegram card stays hidden."
              fi
            fi

            # ml-api always restarts: it holds the model weights in memory, so
            # even a models-only change requires it to reload.
            (cd quantaura-ml && source venv/bin/activate && pip install -r requirements.txt)
            pm2 restart ml-api --update-env
            if [ "$WEB_CHANGED" = "1" ]; then
              pm2 restart quantaura-api --update-env
              pm2 restart quantaura-frontend --update-env
            elif [ "$API_ENV_CHANGED" = "1" ]; then
              # Config-only change: the API must reload it, the frontend needn't.
              pm2 restart quantaura-api --update-env
            fi
            pm2 save

            # ml-api loads TensorFlow + 4 models before it listens (~40s).
            # Fail the deploy if it does not come up healthy with real weights,
            # rather than reporting success over a degraded API.
            echo "Waiting for ml-api to become ready..."
            for i in $(seq 1 20); do
              sleep 5
              HEALTH=$(curl -s --max-time 5 localhost:5051/health || true)
              case "$HEALTH" in
                *'"models_loaded": true'*|*'"models_loaded":true'*)
                  echo "ml-api healthy: $HEALTH"
                  echo "Deployment complete"
                  exit 0
                  ;;
              esac
              case "$HEALTH" in
                *untrained_models*[a-z]*)
                  echo "ml-api came up DEGRADED: $HEALTH"
                  ;;
              esac
            done
            echo "ml-api did not become healthy within 100s. Last: $HEALTH"
            pm2 logs ml-api --lines 40 --nostream || true
            exit 1
