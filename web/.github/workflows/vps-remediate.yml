name: VPS Security Remediation

# Run manually to clean the VPS after a malware incident.
# Also triggers on push to main so the server gets clean code immediately
# after the infected tailwind.config.ts / server.js are overwritten in git.
#
# What this does (in order):
#   1. Stop all PM2 processes so infected Node.js stops running
#   2. Pull the clean origin/main over the infected working tree
#   3. Re-install dependencies WITHOUT postinstall scripts (blocks re-injection)
#   4. Identify which npm package carried the injector (logged, not removed —
#      package.json must be edited manually once the name is known)
#   5. Rebuild the frontend against clean configs
#   6. Restart PM2 and verify no malware remains in tracked files
#
# Secrets required (same as deploy.yml):
#   SERVER_SSH_KEY   base64-encoded PEM private key
#   SERVER_HOST      152.89.253.106
#   SERVER_USER      root

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'quantaura/tailwind.config.ts'
      - 'quantaura-api/server.js'
      - 'quantaura/postcss.config.js'

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Decode deploy key
        run: |
          KEY=$(echo "${{ secrets.SERVER_SSH_KEY }}" | base64 -d)
          if ! printf '%s' "$KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "SERVER_SSH_KEY did not decode to a private key."
            exit 1
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          {
            echo "SSH_PRIVATE_KEY<<__DEPLOY_KEY_EOF__"
            echo "$KEY"
            echo "__DEPLOY_KEY_EOF__"
          } >> "$GITHUB_ENV"

      - name: Remediate VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -e
            SITE=/home/quantaura.tech/public_html

            echo "======================================================"
            echo "STEP 1: Stop all PM2 processes"
            echo "======================================================"
            pm2 stop all || true
            pm2 list

            echo "======================================================"
            echo "STEP 2: Scan for infected files (outside node_modules)"
            echo "======================================================"
            INFECTED=$(grep -rl \
              --include="*.js" --include="*.ts" --include="*.mjs" \
              --exclude-dir=node_modules --exclude-dir=.git \
              "eval(atob\|global\.o='" \
              "$SITE" 2>/dev/null || true)
            if [ -n "$INFECTED" ]; then
              echo "INFECTED FILES FOUND:"
              echo "$INFECTED"
            else
              echo "No infected source files found."
            fi

            echo "======================================================"
            echo "STEP 3: Pull clean code from origin/main"
            echo "======================================================"
            cd "$SITE"
            git fetch origin main
            # Save any local drift before overwriting
            git diff --quiet HEAD || \
              git diff HEAD > "/tmp/server_drift_$(date +%F_%H%M).patch" || true
            git reset --hard origin/main
            echo "Now at: $(git log --oneline -3)"

            echo "======================================================"
            echo "STEP 4: Verify source files are now clean"
            echo "======================================================"
            STILL=$(grep -rl \
              --include="*.js" --include="*.ts" \
              --exclude-dir=node_modules --exclude-dir=.git \
              "eval(atob\|global\.o='" \
              "$SITE" 2>/dev/null || true)
            if [ -n "$STILL" ]; then
              echo "WARNING: Still infected after git reset — check commit history:"
              echo "$STILL"
            else
              echo "Source files clean."
            fi

            echo "======================================================"
            echo "STEP 5: Identify malicious npm package"
            echo "======================================================"
            echo "--- quantaura/node_modules ---"
            HITS_NEXT=$(grep -rl "eval(atob\|global\.o='" \
              "$SITE/quantaura/node_modules" --include="*.js" 2>/dev/null \
              | sed "s|$SITE/quantaura/node_modules/||; s|/.*||" | sort -u || true)
            if [ -n "$HITS_NEXT" ]; then
              echo "Suspicious packages in quantaura/node_modules:"
              echo "$HITS_NEXT"
            else
              echo "(none found)"
            fi

            echo "--- quantaura-api/node_modules ---"
            HITS_API=$(grep -rl "eval(atob\|global\.o='" \
              "$SITE/quantaura-api/node_modules" --include="*.js" 2>/dev/null \
              | sed "s|$SITE/quantaura-api/node_modules/||; s|/.*||" | sort -u || true)
            if [ -n "$HITS_API" ]; then
              echo "Suspicious packages in quantaura-api/node_modules:"
              echo "$HITS_API"
            else
              echo "(none found)"
            fi

            echo "======================================================"
            echo "STEP 6: Reinstall WITHOUT postinstall scripts"
            echo "======================================================"
            # --ignore-scripts blocks the postinstall hook that injects the
            # malware payload. Legitimate packages still function; the hook
            # that writes eval(atob(...)) into config files does not run.
            cd "$SITE/quantaura"
            rm -rf node_modules
            npm install --production=false --ignore-scripts

            cd "$SITE/quantaura-api"
            rm -rf node_modules
            npm install --production --ignore-scripts

            echo "======================================================"
            echo "STEP 7: Check persistence mechanisms"
            echo "======================================================"
            echo "--- crontab ---"
            crontab -l 2>/dev/null || echo "(no crontab)"
            echo "--- ~/.bashrc (suspicious lines) ---"
            grep -n "eval\|atob\|global\.o" ~/.bashrc 2>/dev/null \
              || echo "(no suspicious .bashrc entries)"
            echo "--- ~/.npmrc ---"
            cat ~/.npmrc 2>/dev/null || echo "(no ~/.npmrc)"

            echo "======================================================"
            echo "STEP 8: Rebuild frontend"
            echo "======================================================"
            cd "$SITE/quantaura"
            npm run build

            echo "======================================================"
            echo "STEP 9: Restart PM2"
            echo "======================================================"
            pm2 restart quantaura-api   --update-env
            pm2 restart quantaura-frontend --update-env
            pm2 restart ml-api          --update-env
            pm2 save

            echo "======================================================"
            echo "STEP 10: Final verification"
            echo "======================================================"
            FINAL=$(grep -rl \
              --include="*.js" --include="*.ts" \
              --exclude-dir=node_modules --exclude-dir=.git \
              "eval(atob\|global\.o='" \
              "$SITE" 2>/dev/null || true)
            if [ -n "$FINAL" ]; then
              echo "REMEDIATION INCOMPLETE — malware still present:"
              echo "$FINAL"
              exit 1
            fi
            echo "Remediation complete. No malware found in source files."
            pm2 list
