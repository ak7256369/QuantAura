# Recover a missed daily digest. The scheduler cannot: pushDigestIfDue() is
# gated on the UTC hour and on BotState.lastDigestDate, both of which have
# passed by the time anyone notices. Manual-only, and dry unless asked.
name: Send digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry = print only; live = actually DM subscribers
        type: choice
        options: [dry, live]
        default: dry
      free_channel:
        description: Also post the BTC teaser to the PUBLIC channel (live only)
        type: boolean
        default: false
      notify:
        description: Buzz subscribers' phones (the scheduled digest never does)
        type: boolean
        default: false

concurrency:
  group: send-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Decode deploy key
        env:
          RAW: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if printf '%s' "$RAW" | grep -q "BEGIN .*PRIVATE KEY"; then
            KEY="$RAW"
          else
            KEY=$(printf '%s' "$RAW" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)
          fi
          if ! printf '%s' "$KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "SERVER_SSH_KEY is neither a PEM private key nor its base64."
            exit 1
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          {
            echo "SSH_PRIVATE_KEY<<__DEPLOY_KEY_EOF__"
            echo "$KEY"
            echo "__DEPLOY_KEY_EOF__"
          } >> "$GITHUB_ENV"

      - name: Run the digest
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          envs: MODE,FREE,NOTIFY
          script: |
            set -e
            cd /home/quantaura.tech/bots/quantaura-telegram-bot
            FLAGS=""
            [ "$MODE" = "live" ] && FLAGS="--live"
            [ "$FREE" = "true" ] && FLAGS="$FLAGS --free-channel"
            [ "$NOTIFY" = "true" ] && FLAGS="$FLAGS --notify"
            echo "running: node scripts/send-digest.js $FLAGS"
            node scripts/send-digest.js $FLAGS
        env:
          MODE: ${{ inputs.mode }}
          FREE: ${{ inputs.free_channel }}
          NOTIFY: ${{ inputs.notify }}
