name: Deploy bot to quantaura.tech

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Same in-memory key handling as the product repo's deploy.yml, for the
      # same reason: appleboy actions run in a container that cannot read the
      # runner's ~/.ssh, and a chmod-600 key file inside the workspace is
      # unreadable to the container's user. The `key` input avoids both.
      - name: Decode deploy key
        env:
          RAW: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          # The secret may hold the PEM private key verbatim or its base64.
          # Accept both: pasting the key straight out of ~/.ssh is the likelier
          # mistake, and base64 -d reports it only as "invalid input".
          if printf '%s' "$RAW" | grep -q "BEGIN .*PRIVATE KEY"; then
            KEY="$RAW"
          else
            KEY=$(printf '%s' "$RAW" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)
          fi
          if ! printf '%s' "$KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "SERVER_SSH_KEY is neither a PEM private key nor its base64."
            echo "Set it to the contents of ~/.ssh/id_ed25519, or to:"
            echo "  base64 -w0 ~/.ssh/id_ed25519"
            exit 1
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          {
            echo "SSH_PRIVATE_KEY<<__DEPLOY_KEY_EOF__"
            echo "$KEY"
            echo "__DEPLOY_KEY_EOF__"
          } >> "$GITHUB_ENV"

      # Fail early and legibly on missing config. Without this, an unset
      # SERVER_USER surfaces as an ssh handshake error deep in the action's
      # output, and a wrong port surfaces as a four-minute dial timeout.
      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          MISSING=""
          [ -z "$HOST" ] && MISSING="$MISSING SERVER_HOST"
          [ -z "$USER_NAME" ] && MISSING="$MISSING SERVER_USER"
          if [ -n "$MISSING" ]; then
            echo "Missing repository secret(s):$MISSING"
            exit 1
          fi
          # SERVER_PORT is optional and defaults to 22. Port 21 is FTP — a
          # value that cannot carry SSH is a typo worth catching here rather
          # than in a timeout.
          if [ -n "$PORT" ] && [ "$PORT" = "21" ]; then
            echo "SERVER_PORT is 21 (FTP). SSH on this box is 22 — delete the"
            echo "secret to use the default, or set it to the real SSH port."
            exit 1
          fi

      # Files are pushed FROM the runner rather than pulled by the server so
      # the VPS never needs GitHub credentials for this private repo — the
      # product repo checkout on the server keeps working exactly as before,
      # and this repo needs only the same SSH deploy key.
      - name: Copy source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "."
          target: /home/quantaura.tech/bots/quantaura-telegram-bot
          rm: false

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/quantaura.tech/bots/quantaura-telegram-bot

            if [ ! -f .env ]; then
              echo "No .env on the server yet — create it from .env.example"
              echo "(TELEGRAM_BOT_TOKEN, MONGODB_URI and JWT_SECRET must match quantaura-api's)."
              echo "Deploy stops here; the bot is NOT started without configuration."
              exit 1
            fi

            # BOT_API_BASE became required when the old 127.0.0.1:5000 default
            # turned out to be a different tenant's site on this box. Existing
            # .env files predate the key, so derive it once from quantaura-api's
            # own PORT rather than making someone hand-edit a value that is
            # already written down next door. Never overwrites an existing line.
            if ! grep -qE '^BOT_API_BASE=' .env; then
              API_ENV=/home/quantaura.tech/public_html/quantaura-api/.env
              API_PORT=$(grep -E '^PORT=' "$API_ENV" 2>/dev/null | cut -d= -f2- | tr -d '[:space:]')
              if [ -z "$API_PORT" ]; then
                echo "BOT_API_BASE is unset and quantaura-api's PORT could not be read from"
                echo "$API_ENV — add BOT_API_BASE=http://127.0.0.1:<port> to the bot's .env."
                exit 1
              fi
              printf '\n# Added by deploy: quantaura-api listens here.\nBOT_API_BASE=http://127.0.0.1:%s\n' "$API_PORT" >> .env
              echo "Backfilled BOT_API_BASE=http://127.0.0.1:$API_PORT into .env"
            fi

            npm install --production --no-audit --no-fund

            # startOrRestart: first deploy starts it, later deploys restart it.
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save

            # The bot logs its Telegram identity on boot; fail the deploy if
            # the process dies immediately (bad token, DB down) rather than
            # reporting success over a crash loop.
            sleep 8
            if ! pm2 show quantaura-bot | grep -q "online"; then
              echo "quantaura-bot is not online after restart:"
              pm2 logs quantaura-bot --lines 30 --nostream || true
              exit 1
            fi
            echo "quantaura-bot online."
