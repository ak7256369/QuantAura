# QuantAura X (Twitter) daily post configuration.
# Secrets are NEVER here — they come from environment variables (see README).

channel:
  name: "QuantAura"
  symbol: "BTCUSDT"
  asset_label: "Bitcoin"
  site_url: "https://quantaura.tech"

# The ecosystem's other public surfaces. Duplicated in the sibling repos
# (separate deployments, no shared module):
#   web/quantaura/src/lib/social.ts · quantaura-youtube/config.yaml
#   quantaura-telegram-bot/bot/config.js
#
# The *_label values are drawn on the card, where there is no character budget.
# The URLs are only appended to the tweet when the day's numbers leave room —
# see compose.tweet_text. Content never yields to a link.
links:
  youtube: "https://www.youtube.com/@quantaura_ml"
  youtube_label: "YouTube @quantaura_ml"
  telegram: "https://t.me/quantaura_signals"
  telegram_label: "Telegram t.me/quantaura_signals"

api:
  # The public QuantAura API, called WITHOUT authentication on purpose. The
  # free tier's redaction (no confidence, no per-model votes, no probability
  # split) is exactly this product's content policy: the daily X post is the
  # same direction-only teaser the free Telegram channel gets. Never add a
  # premium login here — the post must be leak-proof by construction.
  base_url: "https://quantaura.tech"
  timeout_seconds: 30
  retries: 3
  retry_backoff_seconds: 20

market:
  # Binance public REST — no key required.
  klines_url: "https://api.binance.com/api/v3/klines"

scoreboard:
  # The live public record lives in the quantaura-youtube repo — the same
  # append-only scoreboard the videos state on screen. One record, one grader:
  # this repo never grades calls itself, so the numbers can never disagree
  # with the channel's. Fetched over the GitHub contents API with a read-only
  # fine-grained PAT (SCOREBOARD_TOKEN); if absent the post simply omits the
  # record lines rather than invent them.
  repo: "ak7256369/quantaura-youtube"
  path: "state/scoreboard.json"

post:
  # X counts every URL as 23 characters regardless of length.
  max_chars: 280
  url_weight: 23
  # The card is decoration; the text carries the content. If media upload
  # fails (quota, API change), post the text alone rather than skip the day.
  require_media: false
  disclaimer: "Automated research — not financial advice."

theme:
  # Same palette as the video pipeline, so every surface of the ecosystem
  # renders the brand identically.
  bg: "#0B0E11"
  panel: "#151A21"
  grid: "#1F2730"
  text: "#EAECEF"
  muted: "#848E9C"
  up: "#16C784"
  down: "#EA3943"
  flat: "#F0B90B"
  accent: "#5B8DEF"
