name: Daily X post

on:
  schedule:
    # 18:30 UTC — half an hour after the daily video's 18:00 slot, same news
    # cycle, so the video run has committed the day's graded scoreboard before
    # this post reads it. 2:30pm US Eastern, into the US afternoon watch window.
    # The 16:00 UTC 4h close is long since settled. Keep this 30 min behind the
    # video cron if that ever moves again.
    - cron: '30 18 * * *'
    # 21:30 UTC catch-up. GitHub's cron is best-effort: runs are delayed under
    # load and dropped outright when the queue is congested. The pipeline
    # refuses to post twice in a UTC day (common.posted_today), so on a normal
    # day this second run exits in seconds having done nothing.
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      no_post:
        description: 'Build the card and text but do not post'
        type: boolean
        default: false
      check:
        description: 'Verify the X credentials end to end, publishing nothing'
        type: boolean
        default: false
      dry_run:
        description: 'Synthetic data, no API calls, no post'
        type: boolean
        default: false
      force:
        description: 'Post even if one already went out today'
        type: boolean
        default: false

# The run log is append-only state in git. Two concurrent runs would race on
# the same file and one would lose its row.
concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write        # commit the run log back to main

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # X developer portal → the app's four OAuth 1.0a keys
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Read-only fine-grained PAT for the channel scoreboard
          # (contents:read on ak7256369/quantaura-youtube). Optional — without
          # it the post omits the public-record lines.
          SCOREBOARD_TOKEN: ${{ secrets.SCOREBOARD_TOKEN }}
          # Operator notifications (same values as the other pipelines)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          [ "${{ inputs.no_post }}" = "true" ] && ARGS="$ARGS --no-post"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.check }}"   = "true" ] && ARGS="$ARGS --check"
          [ "${{ inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          python pipeline.py $ARGS

      - name: Commit run log
        # Runs even when the pipeline skipped the day: the log is the catch-up
        # cron's only way to know the day is already done.
        if: always()
        run: |
          set -e
          if [ -z "$(git status --porcelain state)" ]; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name  "quantaura-x[bot]"
          git config user.email "channel@quantaura.tech"
          git add state
          git commit -m "run log $(date -u +%F)"
          # state/*.jsonl union-merges (state/.gitattributes), so concurrent
          # appends cannot conflict; the retry covers plain push races.
          for i in 1 2 3; do
            if git push; then
              echo "Run log pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected — rebasing on origin/main (attempt $i/3)"
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          done
          echo "Could not push the run log after 3 attempts."
          exit 1

      - name: Upload card artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_number }}
          path: build/*.png
          retention-days: 7
          if-no-files-found: ignore
